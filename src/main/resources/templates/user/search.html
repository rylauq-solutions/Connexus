<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}"
>
  <head>
    <title>Search Contacts</title>
  </head>

  <body>
    <div id="content">
      <!--! LoggedInUser Sidebar -->
      <div th:if="${loggedInUser}">
        <div th:replace="~{user/sidebar::sidebar}"></div>
      </div>

      <!--! Main Content -->
      <div class="sm:pl-55 flex flex-col items-center p-6">
        <h1 class="text-3xl font-bold text-amber-900 dark:text-orange-300 mb-2">
          Search Results
        </h1>
        <p class="text-amber-700 dark:text-orange-200 mb-2">
          Filter and search your Connexus contacts.
        </p>
        <p
          class="text-amber-950 font-semibold dark:text-orange-200 mb-6"
          th:if="${pageContact != null}"
        >
          <span th:text="${pageContact.totalElements}">0</span> results found
        </p>

        <!-- ! Contacts -->
        <div class="contact_container w-full max-w-7xl">
          <div class="relative overflow-x-auto sm:rounded-lg">
            <!--! Controls: Select (left) + Search (right) -->
            <form th:action="@{'/user/contacts/search'}" method="get">
              <!-- reset to first page on new search -->
              <input type="hidden" name="page" value="0" />
              <input type="hidden" name="size" th:value="${pageSize} ?: 5" />

              <div
                class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 p-4 bg-stone-100 dark:bg-stone-800"
              >
                <!-- Select: left -->
                <div class="w-full md:w-1/3">
                  <select
                    name="field"
                    id="filter"
                    class="font-semibold block w-full px-3 py-2.5 text-sm text-amber-900 bg-stone-50 border border-red-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-300 dark:bg-stone-700 dark:text-orange-200 transition-all duration-200 appearance-none cursor-pointer"
                  >
                    <option value="" th:selected="${searchField} == null">
                      Choose a filter
                    </option>
                    <option value="name" th:selected="${searchField} == 'name'">
                      Name
                    </option>
                    <option
                      value="phone"
                      th:selected="${searchField} == 'phone' or ${searchField} == 'phoneNumber'"
                    >
                      Phone
                    </option>
                    <option
                      value="email"
                      th:selected="${searchField} == 'email'"
                    >
                      Email
                    </option>
                  </select>
                </div>

                <!-- Search: right -->
                <div class="w-full md:w-1/3 md:ml-auto">
                  <label for="table-search-users" class="sr-only">Search</label>
                  <div class="relative">
                    <div
                      class="flex items-center bg-stone-50 border border-red-300 rounded-lg dark:bg-stone-700 dark:border-stone-600 transition-all duration-200"
                    >
                      <div class="flex items-center justify-center w-10 h-10">
                        <svg
                          class="w-4 h-4 text-amber-700 dark:text-orange-400"
                          aria-hidden="true"
                          xmlns="http://www.w3.org/2000/svg"
                          fill="none"
                          viewBox="0 0 20 20"
                        >
                          <path
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
                          />
                        </svg>
                      </div>
                      <input
                        name="keyword"
                        type="text"
                        id="table-search-users"
                        th:value="${searchKeyword}"
                        class="block w-full p-2.5 text-sm text-amber-900 placeholder-amber-700 bg-stone-50 border-0 rounded-r-lg focus:outline-none focus:ring-0 dark:bg-stone-700 dark:text-orange-200 font-semibold dark:placeholder-amber-700"
                        placeholder="Search for contacts"
                      />
                    </div>
                  </div>
                </div>

                <!-- Search button -->
                <button
                  class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold tracking-tight text-white bg-red-600 hover:bg-red-700 dark:bg-red-700 dark:hover:bg-red-800 rounded-lg shadow-lg border border-red-300 focus:outline-none focus:ring-2 focus:ring-red-300 dark:focus:ring-red-600 transition-colors duration-200 cursor-pointer"
                  type="submit"
                >
                  Search
                </button>
              </div>
            </form>

            <!-- ! Table -->
            <div
              th:unless="${pageContact.totalElements == 0}"
              class="w-full overflow-x-auto shadow-lg sm:rounded-lg border-2 border-red-200 dark:border-stone-700"
            >
              <table
                class="w-full min-w-full text-sm text-left rtl:text-right text-amber-900 dark:text-orange-200"
              >
                <thead
                  class="text-xs text-amber-800 uppercase bg-stone-200 dark:bg-stone-900 dark:text-orange-200 border-b-2 border-red-300 dark:border-stone-600"
                >
                  <tr>
                    <th scope="col" class="px-4 sm:px-6 py-3 font-bold">
                      Name
                    </th>
                    <th scope="col" class="px-4 sm:px-6 py-3 font-bold">
                      Phone Number
                    </th>
                    <th scope="col" class="px-4 sm:px-6 py-3 font-bold">
                      Links
                    </th>
                    <th scope="col" class="px-4 sm:px-6 py-3 font-bold">
                      Actions
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr
                    th:each="contact : ${pageContact.getContent()}"
                    th:object="${contact}"
                    class="bg-stone-50 border-b dark:bg-stone-800 dark:border-stone-700 border-red-200 hover:bg-red-50 dark:hover:bg-stone-700 transition-all duration-200"
                  >
                    <th
                      scope="row"
                      class="flex items-center px-4 sm:px-6 py-4 text-amber-900 whitespace-nowrap dark:text-orange-100"
                    >
                      <img
                        onerror="this.src='https://i.pinimg.com/736x/f2/d6/d2/f2d6d26e83996554e9334afd3c730dbe.jpg'"
                        class="w-10 h-10 rounded-full border-2 border-red-300 dark:border-stone-600 shadow-md"
                        th:src="@{*{picture}}"
                        src="/docs/images/people/profile-picture-1.jpg"
                        alt="Contact image"
                      />
                      <div class="ps-3">
                        <div
                          class="text-base font-semibold text-amber-900 dark:text-orange-100"
                          th:text="*{name}"
                        ></div>
                        <div
                          class="font-normal text-amber-700 dark:text-orange-300 break-words"
                          th:text="*{email}"
                        ></div>
                      </div>
                    </th>
                    <td
                      class="px-4 sm:px-6 py-4 text-amber-900 dark:text-orange-200"
                    >
                      <i
                        class="fa-solid fa-phone w-4 h-4 text-red-600 dark:text-orange-400 mr-2"
                      ></i>
                      <span th:text="*{phoneNumber}"></span>
                    </td>
                    <td class="px-4 sm:px-6 py-4">
                      <div class="flex items-center gap-3">
                        <a
                          th:href="@{*{websiteLink}}"
                          target="_blank"
                          class="text-amber-900 dark:text-orange-300 hover:text-red-600 dark:hover:text-orange-100 transition-all duration-200"
                        >
                          <i class="fa-solid fa-link w-5 h-5"></i>
                        </a>
                        <a
                          th:href="@{*{linkedInLink}}"
                          target="_blank"
                          class="text-amber-900 dark:text-orange-300 hover:text-red-600 dark:hover:text-orange-100 transition-all duration-200"
                        >
                          <i class="fa-brands fa-linkedin-in w-5 h-5"></i>
                        </a>
                        <i
                          th:if="*{favorite}"
                          class="fa-solid fa-star w-5 h-5 text-yellow-500 dark:text-yellow-400"
                          title="Favorite Contact"
                        ></i>
                      </div>
                    </td>
                    <td class="px-4 sm:px-6 py-4">
                      <div class="flex gap-3">
                        <a
                          href=""
                          class="text-red-600 dark:text-red-400 hover:text-red-800 dark:hover:text-red-300 transition-all duration-200"
                        >
                          <i class="fa fa-trash h-5 w-5" aria-hidden="true"></i>
                        </a>
                        <a
                          href=""
                          class="text-amber-900 dark:text-orange-300 hover:text-red-600 dark:hover:text-orange-100 transition-all duration-200"
                        >
                          <i class="fa-solid fa-pen-to-square h-5 w-5"></i>
                        </a>
                        <a
                          href=""
                          class="text-amber-900 dark:text-orange-300 hover:text-red-600 dark:hover:text-orange-100 transition-all duration-200"
                        >
                          <i class="fa-regular fa-eye h-5 w-5"></i>
                        </a>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>

              <!-- ! Pagination Container -->
              <div
                th:unless="${pageContact.totalElements == 0}"
                class="pagination_container p-4 flex justify-center bg-stone-50 dark:bg-stone-800"
              >
                <nav aria-label="Page navigation example">
                  <ul class="inline-flex -space-x-px text-base h-10">
                    <!-- Previous -->
                    <li th:unless="${pageContact.first}">
                      <a
                        th:href="@{'/user/contacts/search?page=' + (${pageContact.number} - 1)
                                   + '&size=' + ${pageSize}
                                   + '&field=' + ${searchField}
                                   + '&keyword=' + ${searchKeyword}}"
                        class="flex items-center justify-center px-4 h-10 ms-0 leading-tight text-red-700 bg-white border border-e-0 border-red-400 rounded-s-lg hover:bg-red-600 hover:text-white dark:text-orange-100 dark:bg-stone-800 dark:border-stone-500 dark:hover:bg-red-600 dark:hover:text-white transition-colors duration-200"
                        >Previous</a
                      >
                    </li>

                    <!-- Page numbers -->
                    <li
                      th:each="index : ${#numbers.sequence(0, pageContact.totalPages-1)}"
                    >
                      <a
                        th:href="@{'/user/contacts/search?size=' + ${pageSize}
                                   + '&page=' + ${index}
                                   + '&field=' + ${searchField}
                                   + '&keyword=' + ${searchKeyword}}"
                        th:classappend="${index==pageContact.number
                          ? ' text-white bg-red-600 border-red-600 dark:bg-red-500 dark:border-red-500 '
                          : ' text-red-700 bg-white border-red-300 hover:bg-red-100 hover:text-red-800 dark:text-orange-100 dark:bg-stone-800 dark:border-stone-500 dark:hover:bg-stone-700 '}"
                        class="flex items-center justify-center px-4 h-10 leading-tight border rounded border-red-300 transition-colors duration-200"
                      >
                        <span th:text="${index+1}"></span>
                      </a>
                    </li>

                    <!-- Next -->
                    <li th:unless="${pageContact.last}">
                      <a
                        th:href="@{'/user/contacts/search?page=' + (${pageContact.number} + 1)
                                   + '&size=' + ${pageSize}
                                   + '&field=' + ${searchField}
                                   + '&keyword=' + ${searchKeyword}}"
                        class="flex items-center justify-center px-4 h-10 leading-tight text-red-700 bg-white border border-red-400 rounded-e-lg hover:bg-red-600 hover:text-white dark:text-orange-100 dark:bg-stone-800 dark:border-stone-500 dark:hover:bg-red-600 dark:hover:text-white transition-colors duration-200"
                        >Next</a
                      >
                    </li>
                  </ul>
                </nav>
              </div>
            </div>
            <h1
              class="text-center font-semibold text-2xl"
              th:if="${pageContact.totalElements == 0}"
            >
              No Result Found
            </h1>
          </div>
        </div>
      </div>
    </div>

    <script id="script">
      console.log("Search page script loaded");
    </script>
  </body>
</html>
